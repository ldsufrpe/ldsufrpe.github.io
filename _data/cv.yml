- title: Research Interests
  type: nested_list
  contents:
    - title: Discrete Geometry and Applied Topology
      items:
        - Discrete exterior calculus and structure-preserving numerical methods.
        - Discrete curvature in complex networks.
    - title: Symmetry and Scientific Computing
      items:
        - Representation theory and symmetry reduction of linear systems.
        - Symbolic computation and mathematical software with SageMath and Python.
    - title: Quantum Computing
      items:
        - Quantum state preparation and quantum algorithms.
        - Variational quantum circuits and molecular point-group symmetries.

